[workspace]
resolver = "3"
members = ["crates/app_core"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }